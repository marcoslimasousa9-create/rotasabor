<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RotaSabor — App Motoboy</title>
  <link rel="manifest" href="/static/manifest-motoboy.json" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --bg: #0b1220;
      --card: #111a2e;
      --border: #1e2d4a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --info: #38bdf8;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; }
    .container { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .header {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
    .subtitle { font-size: 0.8rem; color: var(--muted); }
    .badge {
      font-size: 0.72rem; font-weight: 700; padding: 5px 10px; border-radius: 999px;
      background: rgba(16, 185, 129, 0.14); color: var(--accent); border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .card-title { font-size: 0.95rem; font-weight: 700; }
    label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select {
      width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .btn {
      width: 100%; border: none; border-radius: 10px; padding: 12px 14px;
      font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.85; }
    .btn-green { background: var(--accent); color: #052016; }
    .btn-blue { background: var(--info); color: #061322; }
    .btn-outline { background: #1a2640; color: var(--text); border: 1px solid var(--border); }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .log-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; font-size: 0.85rem; line-height: 1.45; color: var(--muted);
    }
    .ok { color: var(--accent); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="brand">RotaSabor Motoboy</div>
        <div class="subtitle">Chamadas, status e GPS em Catanduva</div>
      </div>
      <span class="badge">PWA MOTOBOY</span>
    </div>

    <div class="card">
      <div class="card-title">Disponibilidade e entrega</div>
      <div class="row">
        <div>
          <label for="motoboyNome">Entregador</label>
          <input id="motoboyNome" type="text" placeholder="Seu nome" />
        </div>
        <div>
          <label for="statusEntrega">Status atual</label>
          <select id="statusEntrega">
            <option value="disponivel">Disponível</option>
            <option value="coletando">Coletando pedido</option>
            <option value="a_caminho">A caminho da entrega</option>
            <option value="entregue">Entregue</option>
          </select>
        </div>
      </div>
      <div>
        <label for="codigoEntrega">Código / ID do pedido (opcional)</label>
        <input id="codigoEntrega" type="text" placeholder="Ex.: 104" />
      </div>
      <button class="btn btn-green" id="btnAtualizarStatus" type="button">Atualizar status</button>
    </div>

    <div class="card">
      <div class="card-title">Localização GPS</div>
      <div class="row">
        <button class="btn btn-blue" id="btnEnviarGps" type="button">Enviar GPS agora</button>
        <button class="btn btn-outline" id="btnRastreioAuto" type="button">Rastreio auto: OFF</button>
      </div>
      <div class="log-box" id="logBox">
        Pronto para operar. Use <strong>Enviar GPS agora</strong> ou ative o rastreio automático durante as entregas.
      </div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {
          navigator.serviceWorker.register("/static/sw.js").catch(() => {});
        });
      });
    }

    const logBox = document.getElementById("logBox");
    const btnRastreio = document.getElementById("btnRastreioAuto");
    let watchId = null;

    function escreverLog(html) {
      const hora = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      logBox.innerHTML = `<div><span class="ok">[${hora}]</span> ${html}</div>`;
    }

    async function atualizarStatus() {
      const payload = {
        motoboy: document.getElementById("motoboyNome").value.trim() || "Entregador",
        status: document.getElementById("statusEntrega").value,
        pedido_id: document.getElementById("codigoEntrega").value.trim() || null
      };

      const endpoints = ["/api/motoboy/status", "/motoboy/status", "/api/status-entrega"];
      for (const url of endpoints) {
        try {
          const resp = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (resp.ok) {
            escreverLog(`Status atualizado para <span class="ok">${payload.status}</span>${payload.pedido_id ? ` (Pedido #${payload.pedido_id})` : ""}.`);
            return;
          }
        } catch (_) {}
      }

      escreverLog(`<span class="warn">Status selecionado:</span> ${payload.status} (sem confirmação do servidor no momento).`);
    }

    async function enviarCoordenadas(pos) {
      const { latitude, longitude, accuracy } = pos.coords;
      const payload = {
        motoboy: document.getElementById("motoboyNome").value.trim() || "Entregador",
        pedido_id: document.getElementById("codigoEntrega").value.trim() || null,
        lat: latitude,
        lng: longitude,
        accuracy
      };

      const endpoints = ["/api/motoboy/gps", "/motoboy/gps", "/api/gps"];
      for (const url of endpoints) {
        try {
          const resp = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (resp.ok) {
            escreverLog(`GPS enviado: <span class="ok">${latitude.toFixed(5)}, ${longitude.toFixed(5)}</span> (±${Math.round(accuracy)}m)`);
            return;
          }
        } catch (_) {}
      }

      escreverLog(`GPS capturado: <strong>${latitude.toFixed(5)}, ${longitude.toFixed(5)}</strong> (±${Math.round(accuracy)}m)`);
    }

    function erroGps(err) {
      escreverLog(`<span class="warn">Erro de GPS:</span> ${err.message || "Permissão negada ou indisponível"}`);
    }

    function enviarGpsAgora() {
      if (!("geolocation" in navigator)) {
        escreverLog(`<span class="warn">Geolocalização não suportada neste aparelho.</span>`);
        return;
      }
      escreverLog("Capturando localização GPS...");
      navigator.geolocation.getCurrentPosition(enviarCoordenadas, erroGps, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    }

    function alternarRastreioAuto() {
      if (!("geolocation" in navigator)) {
        escreverLog(`<span class="warn">Geolocalização não suportada neste aparelho.</span>`);
        return;
      }

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btnRastreio.textContent = "Rastreio auto: OFF";
        escreverLog("Rastreio automático desligado.");
        return;
      }

      watchId = navigator.geolocation.watchPosition(enviarCoordenadas, erroGps, {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 5000
      });
      btnRastreio.textContent = "Rastreio auto: ON";
      escreverLog(`<span class="ok">Rastreio automático ativado.</span>`);
    }

    document.getElementById("btnAtualizarStatus").addEventListener("click", atualizarStatus);
    document.getElementById("btnEnviarGps").addEventListener("click", enviarGpsAgora);
    document.getElementById("btnRastreioAuto").addEventListener("click", alternarRastreioAuto);
  </script>
</body>
</html>
