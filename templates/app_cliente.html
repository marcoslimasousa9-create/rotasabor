<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RotaSabor — Pedidos Online</title>
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/static/manifest-cliente.json" />
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
  <style>
    :root {
      --bg: #070c16;
      --surface: #0f172a;
      --surface-2: #162033;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --accent-yellow: #facc15;
      --banner-bg: linear-gradient(120deg, #0f2942 0%, #10243e 55%, #172554 100%);
      --banner-border: rgba(56, 189, 248, 0.28);
      --topbar-bg: rgba(11, 18, 32, 0.96);
      --radius: 16px;
    }

    body.theme-light {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #eef2f6;
      --border: rgba(15, 23, 42, 0.12);
      --text: #0f172a;
      --muted: #475569;
      --primary: #0284c7;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --accent-yellow: #facc15;
      --banner-bg: linear-gradient(120deg, #e0f2fe 0%, #f0fdf4 55%, #fef9c3 100%);
      --banner-border: rgba(2, 132, 199, 0.22);
      --topbar-bg: rgba(255, 255, 255, 0.96);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 88px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 25;
      background: var(--topbar-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .topbar-inner { max-width: 980px; margin: 0 auto; }

    .addr-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .addr-btn {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 62%;
    }

    .top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .pill-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    .container { max-width: 980px; margin: 0 auto; padding: 14px 16px; }

    .promo-banner {
      background: var(--banner-bg);
      border: 1px solid var(--banner-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .promo-tag {
      display: inline-block;
      background: var(--accent-yellow);
      color: #090d16;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .promo-title { font-size: 1.02rem; font-weight: 800; margin: 0; }
    .promo-sub { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }

    .promo-badge-price {
      background: var(--accent-yellow);
      color: #070c16;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: center;
      font-weight: 900;
      line-height: 1.05;
      flex-shrink: 0;
    }

    .cat-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .cat-strip::-webkit-scrollbar { display: none; }

    .cat-item {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 14px;
      padding: 8px 10px;
      min-width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .cat-item.active {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.14);
      color: var(--primary);
    }

    .cat-thumb {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--surface-2);
    }

    .filter-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .filter-strip::-webkit-scrollbar { display: none; }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chip.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }
    body:not(.theme-light) .chip.active { color: #04101d; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 0;
    }

    .section-title { margin: 0; font-size: 1rem; font-weight: 800; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .store-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .store-card:hover { border-color: var(--primary); }

    .store-logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      background: var(--surface-2);
      flex-shrink: 0;
    }

    .store-body { flex: 1; min-width: 0; }
    .store-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .store-name { margin: 0; font-size: 1rem; font-weight: 800; }
    .meta { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.74rem;
      font-weight: 700;
      background: var(--surface-2);
      color: var(--text);
    }

    .pill.free { background: rgba(34, 197, 94, 0.16); color: var(--success); }
    .pill.promo { background: rgba(250, 204, 21, 0.22); color: var(--warning); }
    body:not(.theme-light) .pill.promo { color: var(--accent-yellow); }
