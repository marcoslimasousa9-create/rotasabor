<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RotaSabor — App Motoboy</title>
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1220;
      color: #e5e7eb;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 24px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.25rem; color: #f8fafc; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-ghost { background: #1e293b; color: #f8fafc; }
    .btn-primary { background: #2563eb; color: #ffffff; }
    .btn-success { background: #22c55e; color: #052e16; }
    main {
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 20px 40px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1.15rem; margin-bottom: 6px; color: #f9fafb; }
    .subtitle { font-size: 0.88rem; color: #9ca3af; margin-bottom: 16px; }
    .order-card {
      border: 1px solid #1e293b;
      background: #0d1526;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .status-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #1e293b;
      color: #38bdf8;
      margin-left: 8px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .empty-msg { color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>RotaSabor — Motoboy</h1>
      <span class="badge">v2026.11.25.133400</span>
    </div>
    <div style="display:flex;gap:10px;">
      <a class="btn btn-ghost" href="/app-cliente">App Cliente</a>
      <button class="btn btn-ghost" type="button" onclick="loadOrders()">Atualizar</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Entregas Disponíveis e em Andamento</h2>
      <p class="subtitle">Acompanhe os pedidos criados no App Cliente e atualize o estado da entrega.</p>
      <div id="ordersList"><p class="empty-msg">Carregando pedidos...</p></div>
    </section>
  </main>

  <script>
    function formatBRL(value) {
      return "R$ " + Number(value || 0).toFixed(2).replace(".", ",");
    }

    async function loadOrders() {
      const box = document.getElementById("ordersList");
      try {
        const res = await fetch("/api/orders");
        const orders = await res.json();
        if (!Array.isArray(orders) || !orders.length) {
          box.innerHTML = '<p class="empty-msg">Nenhum pedido disponível no momento.</p>';
          return;
        }
        box.innerHTML = orders.slice().reverse().map((o) => {
          const itemsText = Array.isArray(o.items)
            ? o.items.map((i) => `${i.qty}x ${i.name}`).join(", ")
            : "Itens do pedido";
          return `
            <div class="order-card">
              <div>
                <div>
                  <strong>Pedido #${o.id}</strong>
                  <span class="status-pill">${o.status || "Pendente"}</span>
                </div>
                <div style="color:#94a3b8;font-size:0.86rem;margin-top:6px;">${itemsText}</div>
                <div style="color:#38bdf8;font-weight:700;margin-top:6px;">
                  Total: ${formatBRL(o.total)} • Pagamento: ${o.payment || "Pix"}
                </div>
              </div>
              <div class="actions">
                <button class="btn btn-primary" type="button" onclick="updateStatus(${o.id}, 'Em Rota')">Aceitar / Em Rota</button>
                <button class="btn btn-success" type="button" onclick="updateStatus(${o.id}, 'Entregue')">Concluir Entrega</button>
              </div>
            </div>
          `;
        }).join("");
      } catch (err) {
        box.innerHTML = '<p class="empty-msg">Erro ao carregar pedidos.</p>';
      }
    }

    async function updateStatus(orderId, status) {
      try {
        const res = await fetch(`/api/orders/${orderId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status })
        });
        if (!res.ok) throw new Error("Falha ao atualizar status");
        await loadOrders();
      } catch (err) {
        alert("Erro ao atualizar pedido: " + err.message);
      }
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/static/sw.js", { scope: "/" })
          .then((reg) => console.log("SW registado:", reg.scope))
          .catch((err) => console.error("Erro SW:", err));
      });
    }

    loadOrders();
    setInterval(loadOrders, 10000);
  </script>
</body>
</html>
