<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RotaSabor — App do Entregador</title>
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/static/manifest-motoboy.json" />
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #070c16;
      --surface: #0f172a;
      --surface-2: #162033;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #10b981;
      --accent: #38bdf8;
      --warning: #f59e0b;
      --danger: #ef4444;
      --topbar-bg: rgba(11, 18, 32, 0.96);
      --radius: 16px;
    }

    body.theme-light {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #eef2f6;
      --border: rgba(15, 23, 42, 0.12);
      --text: #0f172a;
      --muted: #475569;
      --primary: #16a34a;
      --accent: #0284c7;
      --warning: #d97706;
      --danger: #dc2626;
      --topbar-bg: rgba(255, 255, 255, 0.96);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 25;
      background: var(--topbar-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .topbar-row {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title { font-size: 1.02rem; font-weight: 800; }
    .sub { font-size: 0.75rem; color: var(--muted); }

    .top-actions { display: flex; align-items: center; gap: 8px; }

    .pill-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .container { max-width: 960px; margin: 0 auto; padding: 14px 16px; }

    #liveMap {
      width: 100%;
      height: 250px;
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      background: var(--surface-2);
      z-index: 1;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card-title { margin: 0; font-size: 1rem; font-weight: 800; }
    .meta { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }

    .fee-highlight {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .fee-amount { font-size: 1.05rem; font-weight: 900; color: var(--primary); }

    .code-pill {
      display: inline-block;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .stat-label { font-size: 0.75rem; color: var(--muted); font-weight: 700; }
    .stat-value { font-size: 1.15rem; font-weight: 800; margin-top: 4px; color: var(--primary); }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.16);
      color: var(--primary);
      white-space: nowrap;
    }
    .badge.warn { background: rgba(245, 158, 11, 0.18); color: var(--warning); }
    .badge.offline { background: rgba(148, 163, 184, 0.16); color: var(--muted); }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }

    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; font-weight: 700; }

    select, input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 800;
      font-size: 0.83rem;
      cursor: pointer;
      flex: 1 1 auto;
      text-decoration: none;
      text-align: center;
    }

    .btn-free-big {
      width: 100%;
      padding: 13px 16px;
      font-size: 0.96rem;
      margin-top: 12px;
      background: var(--primary);
      color: #ffffff;
    }
    body:not(.theme-light) .btn-free-big { color: #04130d; }

    .btn-primary { background: var(--primary); color: #ffffff; }
    body:not(.theme-light) .btn-primary { color: #04130d; }
    .btn-blue { background: var(--accent); color: #ffffff; }
    body:not(.theme-light) .btn-blue { color: #04101d; }
    .btn-outline { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--topbar-bg);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 6px;
      z-index: 30;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.78rem;
      padding: 6px;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--primary); }

    .toast {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2);
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 50;
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <div class="title">RotaSabor • Entregador</div>
        <div class="sub" id="gpsStatusLabel">GPS: aguardando ativação</div>
      </div>
      <div class="top-actions">
        <button class="pill-btn" type="button" id="themeToggleBtn">
          <span id="themeIcon">☀️</span>
          <span id="themeLabel">Claro</span>
        </button>
        <button class="pill-btn" type="button" id="refreshBtn">↻</button>
      </div>
    </div>
  </header>

  <div class="toast" id="toastBox"></div>

  <main class="container">
    <!-- ABA MAPA -->
    <section id="tab-map">
      <div class="card">
        <div class="card-top" style="margin-bottom: 10px;">
          <div>
            <div class="card-title" id="connectionHeadline">Você está desconectado</div>
            <div class="meta" id="coordsReadout">Catanduva - SP • Lat: -21.1378 | Lng: -48.9726</div>
          </div>
          <span class="badge offline" id="onlineBadge">Offline</span>
        </div>

        <div id="liveMap"></div>

        <button class="btn btn-free-big" type="button" id="toggleOnlineBtn">▶ Ficar Livre</button>

        <div class="btn-row">
          <button class="btn btn-blue" type="button" id="toggleGpsBtn">Rastreamento ao vivo: ON/OFF</button>
          <a class="btn btn-outline" id="openGmapsCurrentBtn" href="https://www.google.com/maps/@-21.1378,-48.9726,15z" target="_blank" rel="noopener">Abrir Google Maps</a>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Entregas concluídas</div>
          <div class="stat-value" id="doneCountValue">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Ganho de entregas</div>
          <div class="stat-value" id="doneTotalValue">R$ 0,00</div>
        </div>
      </div>

      <div class="card">
        <label for="courierSelect">Entregador ativo</label>
        <select id="courierSelect">
          <option value="">Selecione um entregador cadastrado...</option>
        </select>
        <div class="grid-2" style="margin-top: 10px;">
          <div>
            <label for="manualLat">Latitude manual</label>
            <input type="text" id="manualLat" placeholder="-21.1378" />
          </div>
          <div>
            <label for="manualLng">Longitude manual</label>
            <input type="text" id="manualLng" placeholder="-48.9726" />
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-outline" type="button" id="sendOnceGpsBtn">Enviar GPS agora</button>
          <button class="btn btn-blue" type="button" id="sendManualGpsBtn">Aplicar coordenadas</button>
        </div>
      </div>
    </section>

    <!-- ABA ENTREGAS -->
    <section id="tab-active" class="hidden">
      <h3 style="margin: 6px 0 10px;">Entregas disponíveis e em andamento</h3>
      <div id="activeOrdersList"></div>
    </section>

    <!-- ABA CONCLUÍDAS -->
    <section id="tab-history" class="hidden">
      <h3 style="margin: 6px 0 10px;">Entregas concluídas</h3>
      <div id="doneOrdersList"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="tab-map" type="button">🗺 Mapa</button>
    <button class="nav-btn" data-tab="tab-active" type="button">🛵 Entregas</button>
    <button class="nav-btn" data-tab="tab-history" type="button">✓ Concluídas</button>
  </nav>

  <script>
    let watchId = null;
    let couriers = [];
    let orders = [];
    let isOnline = false;
    let currentLat = -21.1378;
    let currentLng = -48.9726;
    let map = null;
    let courierMarker = null;

    const fmtBRL = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    function applyTheme() {
      const saved = localStorage.getItem("rotasabor_motoboy_theme") || "dark";
      const isLight = saved === "light";
      document.body.classList.toggle("theme-light", isLight);
      document.getElementById("themeIcon").textContent = isLight ? "🌙" : "☀️";
      document.getElementById("themeLabel").textContent = isLight ? "Preto" : "Claro";
    }

    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      const next = document.body.classList.contains("theme-light") ? "dark" : "light";
      localStorage.setItem("rotasabor_motoboy_theme", next);
      applyTheme();
    });

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      box.textContent = msg;
      box.style.display = "block";
      clearTimeout(window._t);
      window._t = setTimeout(() => { box.style.display = "none"; }, 2600);
    }

    function initMap() {
      if (typeof L === "undefined" || map) return;
      map = L.map("liveMap").setView([currentLat, currentLng], 15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap"
      }).addTo(map);
      courierMarker = L.circleMarker([currentLat, currentLng], {
        radius: 10,
        color: "#ffffff",
        weight: 3,
        fillColor: "#10b981",
        fillOpacity: 1
      }).addTo(map).bindPopup("Você está aqui");
      updateGmapsCurrentLink();
    }

    function updateMapPosition(lat, lng) {
      currentLat = Number(lat);
      currentLng = Number(lng);
      document.getElementById("coordsReadout").textContent =
        `Lat: ${currentLat.toFixed(6)} | Lng: ${currentLng.toFixed(6)}`;
      updateGmapsCurrentLink();
      if (map && courierMarker) {
        courierMarker.setLatLng([currentLat, currentLng]);
        map.panTo([currentLat, currentLng], { animate: true });
      }
    }

    function updateGmapsCurrentLink() {
      const link = document.getElementById("openGmapsCurrentBtn");
      link.href = `https://www.google.com/maps/search/?api=1&query=${currentLat},${currentLng}`;
    }

    function buildGoogleMapsRouteUrl(destinationAddress) {
      const dest = encodeURIComponent(destinationAddress || "Catanduva, SP");
      return `https://www.google.com/maps/dir/?api=1&origin=${currentLat},${currentLng}&destination=${dest}&travelmode=driving`;
    }

    function switchTab(id) {
      document.querySelectorAll("main > section").forEach((s) => s.classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
      document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === id));
      if (id === "tab-map" && map) {
        setTimeout(() => map.invalidateSize(), 120);
      }
    }

    document.querySelectorAll(".nav-btn").forEach((b) => {
      b.addEventListener("click", () => switchTab(b.dataset.tab));
    });

    function syncOnlineUi() {
      const btn = document.getElementById("toggleOnlineBtn");
      const badge = document.getElementById("onlineBadge");
      const headline = document.getElementById("connectionHeadline");

      if (isOnline) {
        btn.textContent = "■ Ficar Offline";
        badge.textContent = "Livre / Online";
        badge.className = "badge";
        headline.textContent = "Você está livre para rotas";
      } else {
        btn.textContent = "▶ Ficar Livre";
        badge.textContent = "Offline";
        badge.className = "badge offline";
        headline.textContent = "Você está desconectado";
      }
    }

    document.getElementById("toggleOnlineBtn").addEventListener("click", () => {
      const courierId = document.getElementById("courierSelect").value;
      if (!courierId) {
        showToast("Selecione um entregador primeiro.");
        return;
      }
      isOnline = !isOnline;
      localStorage.setItem("rotasabor_courier_online", isOnline ? "1" : "0");
      syncOnlineUi();
      if (isOnline && watchId === null) {
        startContinuousGps();
      }
      showToast(isOnline ? "Você está livre e rastreando GPS!" : "Você ficou offline");
    });

    async function loadCouriers() {
      try {
        const res = await fetch("/api/couriers");
        if (res.ok) couriers = await res.json();
      } catch (_) {}

      const sel = document.getElementById("courierSelect");
      const currentVal = localStorage.getItem("rotasabor_courier_id") || sel.value;
      sel.innerHTML = `<option value="">Selecione um entregador...</option>` + couriers.map((c) =>
        `<option value="${c.id}">${c.name} (${c.vehicle || "Moto"}${c.plate ? " • " + c.plate : ""})</option>`
      ).join("");

      if (currentVal) sel.value = currentVal;
      isOnline = localStorage.getItem("rotasabor_courier_online") === "1";
      syncOnlineUi();
    }

    document.getElementById("courierSelect").addEventListener("change", (e) => {
      localStorage.setItem("rotasabor_courier_id", e.target.value);
      renderOrders();
    });

    async function sendLocation(lat, lng) {
      updateMapPosition(lat, lng);
      const courierId = document.getElementById("courierSelect").value;
      if (!courierId) return;
      try {
        const res = await fetch(`/api/couriers/${courierId}/location`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lat: Number(lat), lng: Number(lng) })
        });
        if (res.ok) {
          document.getElementById("gpsStatusLabel").textContent =
            `GPS ao vivo: ${Number(lat).toFixed(4)}, ${Number(lng).toFixed(4)}`;
        }
      } catch (_) {}
    }

    function startContinuousGps() {
      if (!navigator.geolocation) {
        showToast("Geolocalização não disponível neste aparelho.");
        return;
      }
      if (watchId !== null) return;
      watchId = navigator.geolocation.watchPosition(
        (pos) => sendLocation(pos.coords.latitude, pos.coords.longitude),
        () => showToast("Permita o acesso à localização no navegador."),
        { enableHighAccuracy: true, maximumAge: 3000 }
      );
      document.getElementById("gpsStatusLabel").textContent = "GPS contínuo ativo";
    }

    function stopContinuousGps() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        document.getElementById("gpsStatusLabel").textContent = "GPS contínuo pausado";
      }
    }

    document.getElementById("sendOnceGpsBtn").addEventListener("click", () => {
      if (!navigator.geolocation) {
        showToast("Geolocalização não suportada.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          sendLocation(pos.coords.latitude, pos.coords.longitude);
          showToast("Localização atualizada no mapa!");
        },
        () => showToast("Não foi possível obter sua localização."),
        { enableHighAccuracy: true }
      );
    });

    document.getElementById("toggleGpsBtn").addEventListener("click", () => {
      if (watchId !== null) {
        stopContinuousGps();
        showToast("Rastreamento contínuo pausado");
      } else {
        startContinuousGps();
        showToast("Rastreamento contínuo ativado");
      }
    });

    document.getElementById("sendManualGpsBtn").addEventListener("click", () => {
      const lat = parseFloat(document.getElementById("manualLat").value);
      const lng = parseFloat(document.getElementById("manualLng").value);
      if (Number.isNaN(lat) || Number.isNaN(lng)) {
        showToast("Informe latitude e longitude válidas.");
        return;
      }
      sendLocation(lat, lng
