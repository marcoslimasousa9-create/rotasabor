<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RotaSabor — Motoboy</title>
  <meta name="theme-color" content="#0b1220" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111b2e;
      --panel-2: #16233b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #f59e0b;
      --border: rgba(148, 163, 184, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 48px;
    }
    header {
      background: rgba(17, 27, 46, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.15rem; color: var(--accent); }
    .badge {
      font-size: 0.75rem;
      background: var(--panel-2);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary {
      background: var(--accent);
      color: #06101d;
      font-weight: 700;
      border: none;
    }
    .btn-success {
      background: var(--accent-2);
      color: #052e16;
      font-weight: 700;
      border: none;
    }
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 18px;
    }
    .resumo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .stat-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-2);
      margin-top: 6px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .chamada-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .muted { color: var(--muted); font-size: 0.86rem; }
    .valor { font-weight: 700; color: var(--accent); font-size: 1.05rem; }
    .status {
      font-size: 0.76rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>RotaSabor — Motoboy</h1>
      <span class="badge">v{{ build_version or "online" }}</span>
    </div>
    <div>
      <a class="btn" href="/app-cliente">App Cliente</a>
      <button class="btn btn-primary" onclick="carregarEstado()">Atualizar</button>
    </div>
  </header>

  <main class="container">
    <div class="resumo-grid">
      <div class="stat-card">
        <div class="muted">Entregas Concluídas</div>
        <div class="stat-val" id="entregasCount">0</div>
      </div>
      <div class="stat-card">
        <div class="muted">Total Acumulado</div>
        <div class="stat-val" id="totalGanho">R$ 0,00</div>
      </div>
    </div>

    <div class="card">
      <h2>Chamadas de Entrega</h2>
      <p class="muted" style="margin-top: 4px;">Aceite chamadas disponíveis e conclua quando finalizar a entrega.</p>
      <div id="chamadasContainer" class="muted" style="margin-top: 12px;">Carregando chamadas...</div>
    </div>
  </main>

  <script>
    function fmtBRL(v) {
      return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    async function carregarEstado() {
      const el = document.getElementById("chamadasContainer");
      try {
        const res = await fetch("/api/motoboy/estado");
        const data = await res.json();
        const resumo = data.resumo || {};
        const chamadas = data.chamadas || [];

        document.getElementById("entregasCount").textContent = resumo.entregas_concluidas || 0;
        document.getElementById("totalGanho").textContent = fmtBRL(resumo.total_ganho || 0);

        if (!chamadas.length) {
          el.textContent = "Nenhuma chamada no momento.";
          return;
        }

        el.innerHTML = chamadas.map(ch => {
          let acaoHtml = "";
          if (ch.status === "disponivel") {
            acaoHtml = `<button class="btn btn-primary" onclick="aceitar(${ch.id})">Aceitar</button>`;
          } else if (ch.status === "em_andamento") {
            acaoHtml = `<button class="btn btn-success" onclick="concluir(${ch.id})">Concluir</button>`;
          }
          return `
            <div class="chamada-item">
              <div>
                <strong>#${ch.id} • ${ch.loja}</strong>
                <span class="status">${ch.status}</span>
                <div class="muted" style="margin-top: 4px;">${ch.bairro}</div>
              </div>
              <div style="display:flex; align-items:center; gap:12px;">
                <span class="valor">${fmtBRL(ch.valor)}</span>
                ${acaoHtml}
              </div>
            </div>
          `;
        }).join("");
      } catch (e) {
        el.textContent = "Erro ao carregar chamadas.";
      }
    }

    async function aceitar(id) {
      await fetch(`/api/motoboy/aceitar/${id}`, { method: "POST" });
      carregarEstado();
    }

    async function concluir(id) {
      await fetch(`/api/motoboy/concluir/${id}`, { method: "POST" });
      carregarEstado();
    }

    carregarEstado();
    setInterval(carregarEstado, 6000);
  </script>
</body>
</html>
